<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<title>Pilates para Mulheres na Menopausa — Teste de 1 minuto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Tipografia HARNA-like: Mulish (substituto livre mais próximo). Troque aqui se tiver a fonte exata. -->
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ====== TOKENS DE MARCA (edite aqui) ====== */
    --brand:#A8195C;          /* magenta primário HARNA-like (botões, destaques, progresso) */
    --brand-dark:#8E1450;
    --brand-soft:#FCEEF4;     /* fundo de opção selecionada */
    --brand-purple:#9f00a7;   /* cor de marca dos metadados (alternativa) */
    --ink:#2D2D2D;            /* texto chumbo */
    --muted:#7A8190;
    --bg:#ffffff;
    --card:#ffffff;
    --line:#ECECEC;
    --line-strong:#2D2D2D;
    --orange:#F5631E;         /* tags de desconto */
    --yellow:#FFE9A8;         /* banner parabéns */
    --green:#1FA463;
    --radius:18px;
    --shadow:0 4px 20px rgba(45,45,45,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:'Mulish',sans-serif;background:#eef0f3;color:var(--ink);line-height:1.5;overflow-x:hidden}
  /* iOS/Safari renderiza texto de <button> sem color explícito em azul-sistema. Força herdar a cor do body. */
  button{color:inherit;-webkit-text-fill-color:currentColor;font-family:inherit}
  .app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.05)}

  .pg{display:none;min-height:100vh;flex-direction:column;animation:fade .3s ease}
  .pg.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- TOP BAR (logo) ---------- */
  .topbar{display:flex;align-items:center;justify-content:center;padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:30}
  .logo{height:88px;width:auto}
  .logo-fallback{font-family:'Mulish';font-weight:900;font-size:20px;letter-spacing:-.01em;color:var(--ink)}
  .logo-fallback small{color:var(--brand)}

  /* ---------- PROGRESS BAR (segmentada, estilo HARNA) ---------- */
  .qbar{display:flex;align-items:center;gap:10px;padding:14px 16px;position:sticky;top:0;background:#fff;z-index:30}
  .back{width:34px;height:34px;border-radius:50%;border:none;background:#f1f2f5;color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .segs{display:flex;gap:6px;flex:1}
  .seg{flex:1;height:6px;background:#eceef1;border-radius:99px;overflow:hidden}
  .seg > i{display:block;height:100%;background:var(--brand);border-radius:99px;width:0;transition:width .4s ease}

  /* ---------- BODY ---------- */
  .body{flex:1;padding:18px 18px 120px;display:flex;flex-direction:column}
  .q-title{font-size:25px;font-weight:800;text-align:center;line-height:1.22;letter-spacing:-.01em;margin-bottom:6px;color:var(--ink);-webkit-text-fill-color:var(--ink)}
  .q-title .hl{color:var(--brand);-webkit-text-fill-color:var(--brand)}
  /* Neutraliza links que o iOS/Safari cria por data-detection (telefone/data/idade) no texto das perguntas e opções */
  .q-title a,.q-hint a,.opt a,.ol a{color:inherit;-webkit-text-fill-color:inherit;text-decoration:none;pointer-events:none}
  .q-hint{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:.16s;text-align:left;width:100%}
  .opt:hover{border-color:#d8b9c8}
  .opt.sel{border-color:var(--brand);background:var(--brand-soft)}
  .opt .ic{font-size:22px;flex:0 0 auto;width:30px;text-align:center}
  .opt .ol{flex:1}
  .opt .ol b{display:block;font-weight:700;font-size:16px}
  .opt .ol span{display:block;color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
.opt-ic-img{width:40px;height:40px;object-fit:contain;flex:0 0 auto}
  .below-img{width:100%;border-radius:16px;overflow:hidden;margin-top:20px;box-shadow:var(--shadow)}
  .below-img img{width:100%;display:block}
  .affirm-img-full{width:100%;margin-bottom:22px}
  .affirm-img-full img{width:100%;height:auto;display:block;border-radius:18px}
  .consent-img{width:100%;max-width:300px;margin:14px auto 0}
  .consent-img img{width:100%;height:auto;display:block}
  .opt .chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
  .opt.sel .chk{background:var(--line-strong);border-color:var(--line-strong)}

  /* image options */
  .opt-img .thumb{width:62px;height:62px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,#f3eef1,#ead9e3);display:flex;align-items:center;justify-content:center;font-size:26px;overflow:hidden}
  .opt-img .thumb img{width:100%;height:100%;object-fit:cover}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid2 .opt{flex-direction:column;text-align:center;align-items:center;gap:8px}
  .grid2 .opt .thumb{width:100%;height:140px}
  .opt-img .thumb img{width:100%;height:100%;object-fit:cover}
  .grid2 .opt .ol b{font-size:14px}
  .grid2 .opt:last-child:nth-child(odd){grid-column:1 / -1}

  /* ---------- FOOTER ---------- */
  .foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:linear-gradient(to top,#fff 70%,rgba(255,255,255,0));padding:14px 18px calc(18px + env(safe-area-inset-bottom));z-index:30}
  .btn{width:100%;border:none;border-radius:99px;padding:17px;font-size:16px;font-weight:800;font-family:'Mulish';cursor:pointer;transition:.18s;background:var(--brand);color:#fff;letter-spacing:.01em}
  .btn:disabled{background:#e3d5dd;color:#fff;cursor:not-allowed}
  .btn:not(:disabled):active{transform:scale(.985)}

  /* ---------- FULL PAGES ---------- */
  .full{flex:1;display:flex;flex-direction:column;padding:24px 20px 120px}
  .full.center{justify-content:center;text-align:center}
  .hero-img{width:100%;height:240px;border-radius:20px;margin-bottom:22px;background:linear-gradient(135deg,#f3eef1,#e3cdd9);display:flex;align-items:center;justify-content:center;font-size:72px;overflow:hidden}
  .hero-img img{width:100%;height:100%;object-fit:cover}
  .badge{display:inline-block;background:var(--ink);color:#fff;font-size:11px;font-weight:800;letter-spacing:.12em;padding:7px 16px;border-radius:99px;margin:0 auto 16px}
  .big{font-size:27px;font-weight:900;line-height:1.2;letter-spacing:-.01em;margin-bottom:10px}
  .big .hl{color:var(--brand)}
  .lead{color:var(--muted);font-size:16px;margin-bottom:6px;font-weight:500}
  .lead b{color:var(--ink);font-weight:800}

  /* inputs */
  .inp-wrap{margin:30px 0;text-align:center}
  .unit-toggle{display:inline-flex;background:#f1f2f5;border-radius:99px;padding:4px;margin-bottom:34px}
  .unit-toggle button{border:none;background:none;padding:9px 24px;border-radius:99px;font-weight:800;font-family:'Mulish';color:var(--muted);cursor:pointer;font-size:14px}
  .unit-toggle button.on{background:var(--ink);color:#fff}
  .num-in{display:flex;align-items:baseline;justify-content:center;gap:10px;border-bottom:2px solid var(--line);padding-bottom:8px;max-width:290px;margin:0 auto}
  .num-in input{border:none;outline:none;font-size:42px;font-weight:800;font-family:'Mulish';text-align:right;width:170px;background:none;color:var(--ink)}
  .num-in input::placeholder{color:#cdd2da}
  .num-in .u{font-size:26px;font-weight:800;font-family:'Mulish';color:var(--muted)}

  /* profile / IMC */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .imc-top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600}
  .imc-you{display:inline-block;background:var(--ink);color:#fff;font-size:12px;font-weight:800;padding:4px 12px;border-radius:99px}
  .imc-bar{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#4aa3e0,#1FA463 38%,#1FA463 55%,#f0a93f 78%,#e35d4b);margin:8px 0 6px}
  .imc-mark{position:absolute;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
  .imc-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:600}
  .pf-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
  .pf-row:last-child{border-bottom:none}
  .pf-row .pf-ic{font-size:20px;width:30px;text-align:center}
  .pf-row .pf-k{font-size:12px;color:var(--muted);font-weight:600}
  .pf-row .pf-v{font-weight:800;font-size:16px}

  /* loader */
  .ldr-ring{width:150px;height:150px;margin:6px auto 24px;position:relative}
  .ldr-ring svg{transform:rotate(-90deg)}
  .ldr-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--brand)}
  .ldr-steps{text-align:left;max-width:300px;margin:0 auto}
  .ldr-step{display:flex;align-items:center;gap:10px;padding:9px 0;color:var(--muted);font-size:14px;font-weight:600;opacity:.4;transition:.3s}
  .ldr-step.done{opacity:1;color:var(--ink)}
  .ldr-step .s-ic{width:22px;height:22px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
  .ldr-step.done .s-ic{background:var(--green)}

  /* email */
  .email-in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:16px;font-size:16px;font-family:'Mulish';font-weight:600;margin-bottom:12px;outline:none}
  .email-in:focus{border-color:var(--brand)}
  .priv{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600;margin-top:2px}
  .soc-proof{background:var(--brand-soft);border-radius:16px;padding:20px;text-align:center;margin-top:18px}
  .soc-proof b{font-weight:900;font-size:26px;color:var(--brand);display:block}
  .soc-proof span{font-size:13px;color:var(--muted);font-weight:600}

  /* pricing */
  .compare{display:flex;gap:10px;margin:18px 0;align-items:stretch}
  .compare .col{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--shadow)}
  .compare .col h4{font-size:15px;margin-bottom:10px;font-weight:800}
  .compare .col .num{font-size:26px;font-weight:900;color:var(--brand)}
  .compare .col .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
  .arrow{display:flex;align-items:center;color:var(--brand);font-size:26px;font-weight:900}
  .congrats{background:var(--yellow);border-radius:14px;padding:14px;text-align:center;margin:14px 0;font-weight:700}
  .congrats b{font-weight:900}
  .plan{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;cursor:pointer;position:relative;transition:.16s}
  .plan.sel{border-color:var(--brand);background:var(--brand-soft)}
  .plan .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
  .plan.sel .radio{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px #fff}
  .plan .p-mid{flex:1}
  .plan .p-mid b{font-size:16px;font-weight:800}
  .plan .p-mid .old{color:var(--muted);text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:600}
  .plan .p-mid .note{font-size:11px;color:var(--muted);margin-top:3px;font-weight:600}
  .plan .p-right{text-align:right}
  .plan .p-right .day{font-weight:900;font-size:19px;color:var(--brand)}
  .plan .p-right .per{font-size:11px;color:var(--muted);font-weight:600}
  .tag-pop{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 14px;border-radius:99px}
  .tag-off{display:inline-block;background:var(--orange);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;margin-bottom:4px}
  .plan-card{position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:18px 16px 16px;margin-bottom:14px;cursor:pointer;transition:.16s}
  .plan-card.sel{border-color:var(--brand);background:var(--brand-soft);box-shadow:0 0 0 3px rgba(168,25,92,.12)}
  .pc-pop{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand);color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;padding:4px 14px;border-radius:99px}
  .pc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .pc-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
  .plan-card.sel .pc-radio{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 4px #fff}
  .pc-name{font-weight:900;font-size:19px}
  .pc-recebe{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
  .pc-list{list-style:none;padding:0;margin:0 0 14px}
  .pc-list li{position:relative;padding:6px 0 6px 28px;font-size:14px;line-height:1.45;color:#3a4658}
  .pc-list li::before{content:'✓';position:absolute;left:0;top:6px;width:18px;height:18px;background:var(--brand);color:#fff;border-radius:50%;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .pc-list li b{color:var(--ink)}
  .pc-price{display:flex;align-items:center;gap:10px;border-top:1px dashed var(--line);padding-top:12px}
  .pc-old{color:var(--muted);text-decoration:line-through;font-size:15px;font-weight:600}
  .pc-now{font-size:26px;font-weight:900;color:var(--brand)}
  .pc-tag{background:var(--orange);color:#fff;font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;margin-left:auto}
  .guar{text-align:center;margin:22px 0}
  .guar .seal{font-size:50px}
  .testi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
  .testi .t-hd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .testi .t-av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#d14d8a)}
  .testi .t-name{font-weight:800;font-size:14px}
  .testi .stars{color:#f0a93f;font-size:13px}
  .testi p{font-size:14px;color:#444;font-weight:500}
  .fine{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;font-weight:500}
  .fine a{color:var(--brand)}
  .faq{display:flex;flex-direction:column;gap:10px}
  .faq-item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .faq-q{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px;cursor:pointer;font-weight:700;font-size:15px;line-height:1.35}
  .faq-q .faq-ic{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;transition:transform .25s}
  .faq-item.open .faq-ic{transform:rotate(45deg)}
  .faq-item.open .faq-q{color:var(--brand)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height .3s ease}
  .faq-item.open .faq-a{max-height:320px}
  .faq-a p{font-size:14px;color:#3a4658;line-height:1.55;padding:0 16px 16px}
  h3.sec{text-align:center;margin:18px 0 12px;color:var(--ink);font-weight:900;font-size:20px}
  /* página inicial (start) */
  .start-h1{font-size:23px;font-weight:900;text-align:center;line-height:1.24;letter-spacing:-.01em;color:var(--ink);margin-top:6px}
  .start-h2{font-size:16px;font-weight:800;text-align:center;color:var(--brand);margin-top:12px;letter-spacing:.01em}
  .start-q{font-size:16px;font-weight:700;text-align:center;color:var(--ink);margin:4px 0 16px}
  .opt-center{justify-content:center;text-align:center}
  .mini-quadro{background:var(--brand-soft);border:1.5px dashed var(--brand);border-radius:14px;padding:14px 16px;text-align:center;font-size:14px;font-weight:600;color:var(--ink);margin-top:18px}
  /* cabeçalho de quiz com logo + progresso */
  .qhead{position:sticky;top:0;background:#fff;z-index:30;padding:12px 16px 14px;border-bottom:1px solid var(--line)}
  .qhead-row{display:flex;align-items:center;justify-content:center;position:relative;min-height:64px;margin-bottom:10px}
  .qhead-row .back{position:absolute;left:0;top:50%;transform:translateY(-50%)}
  .qhead-row .logo{height:64px;width:auto}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
/* ============================================================
   CONFIG DE MARCA
   ============================================================ */

const app = document.getElementById('app');
const QUIZ_TYPES=['start','single','multi','input'];
const totalQuiz = STEPS.filter(s=>QUIZ_TYPES.includes(s.type)).length;
const SEGMENTS = Math.max(...STEPS.map(s=>s.seg))+1;

function quizIndexOf(i){let c=0;for(let k=0;k<=i;k++){if(QUIZ_TYPES.includes(STEPS[k].type))c++;}return c;}

function logoHTML(){
  return BRAND.logo
    ? `<img class="logo" src="${BRAND.logo}" alt="logo">`
    : `<div class="logo-fallback">${BRAND.logoText}</div>`;
}
function topbar(){ return `<div class="topbar">${logoHTML()}</div>`; }

function segBar(){
  const qi=quizIndexOf(state.idx);
  const per=totalQuiz/SEGMENTS;
  let out='';
  for(let s=0;s<SEGMENTS;s++){
    const a=s*per, b=(s+1)*per;
    let fill = qi>=b?100 : qi<=a?0 : ((qi-a)/per)*100;
    out+=`<div class="seg"><i style="width:${fill}%"></i></div>`;
  }
  // cabeçalho com logo (todas as páginas) + voltar + progresso
  return `<div class="qhead"><div class="qhead-row"><button class="back" onclick="goBack()">‹</button>${logoHTML()}</div><div class="segs">${out}</div></div>`;
}
function footer(label,disabled){
  return `<div class="foot"><button class="btn" id="next-btn" ${disabled?'disabled':''} onclick="goNext()">${label||'Continuar'}</button></div>`;
}

function render(){
  const s=STEPS[state.idx];
  let h='';
  switch(s.type){
    case 'start':   h=renderStart(s); break;
    case 'single':  h=renderSingle(s); break;
    case 'multi':   h=renderMulti(s); break;
    case 'affirm':  h=renderAffirm(s); break;
    case 'consent': h=renderConsent(s); break;
    case 'input':   h=renderInput(s); break;
    case 'profile': h=renderProfile(s); break;
    case 'loader':  h=renderLoader(s); break;
    case 'email':   h=renderEmail(s); break;
    case 'pricing': h=renderPricing(s); break;
  }
  app.innerHTML=`<div class="pg active">${h}</div>`;
  window.scrollTo(0,0);
  if(s.type==='loader') runLoader();
}

function renderStart(s){
  const sel=state.answers[s.id];
  const opts=s.opts.map(o=>`<button class="opt opt-center ${sel===o.val?'sel':''}" onclick="pickSingle(this,'${s.id}','${o.val}',true)"><div class="ol"><b>${o.label}</b></div></button>`).join('');
  return topbar()+`
    <div class="full" style="padding-top:16px">
      <h1 class="start-h1">${s.h1||''}</h1>
      ${s.h2?`<div class="start-h2">${s.h2}</div>`:''}
      ${s.badge?`<div class="badge" style="display:block;width:max-content;margin:14px auto 0">${s.badge}</div>`:''}
      ${s.question?`<div class="start-q" style="margin-top:14px">${s.question}</div>`:''}
      <div class="opts">${opts}</div>
      ${s.miniQuadro?`<div class="mini-quadro">${s.miniQuadro}</div>`:''}
      ${s.img?`<div class="hero-img" data-slot="hero" style="margin-top:18px;margin-bottom:0">${s.image&&IMAGES[s.image]?`<img src="${IMAGES[s.image]}" alt="">`:'🧘‍♀️'}</div>`:''}
    </div>`;
}

function renderSingle(s){
  const sel=state.answers[s.id];
  const grid=s.grid||'';
  const opts=s.opts.map(o=>{
    const thumb=s.img?`<div class="thumb" data-slot="${s.id}-${o.val}">${o.img&&IMAGES[o.img]?`<img src="${IMAGES[o.img]}" alt="">`:(o.ic||'🧍‍♀️')}</div>`:`<div class="ic">${o.ic||''}</div>`;
    const sub=o.sub?`<span>${o.sub}</span>`:'';
    return `<button class="opt ${s.img?'opt-img':''} ${sel===o.val?'sel':''}" onclick="pickSingle(this,'${s.id}','${o.val}',true)">${thumb}<div class="ol"><b>${o.label}</b>${sub}</div></button>`;
  }).join('');
  return segBar()+`<div class="body"><h2 class="q-title">${s.title}</h2>${s.hint?`<div class="q-hint">${s.hint}</div>`:''}<div class="opts ${grid}">${opts}</div>${s.belowImg&&IMAGES[s.belowImg]?`<div class="below-img"><img src="${IMAGES[s.belowImg]}" alt=""></div>`:''}</div>`;
}

function renderMulti(s){
  const sel=state.answers[s.id]||[];
  const opts=s.opts.map(o=>{
    const on=sel.includes(o.val);
    return `<button class="opt ${on?'sel':''}" onclick="toggleMulti(this,'${s.id}','${o.val}',${!!o.solo})">${o.img&&IMAGES[o.img]?`<img class="opt-ic-img" src="${IMAGES[o.img]}" alt="">`:`<div class="ic">${o.ic||''}</div>`}<div class="ol"><b>${o.label}</b>${o.sub?`<span>${o.sub}</span>`:''}</div><div class="chk">${on?'✓':''}</div></button>`;
  }).join('');
  const ok=sel.length>=(s.min||1);
  return segBar()+`<div class="body"><h2 class="q-title">${s.title}</h2>${s.hint?`<div class="q-hint">${s.hint}</div>`:''}<div class="opts">${opts}</div></div>`+footer(s.cta||'Continuar',!ok);
}

function renderAffirm(s){
  const has=s.image&&IMAGES[s.image];
  const imgBlock = has
    ? (s.imgFull
        ? `<div class="affirm-img-full"><img src="${IMAGES[s.image]}" alt=""></div>`
        : `<div class="hero-img" data-slot="affirm"><img src="${IMAGES[s.image]}" alt=""></div>`)
    : `<div class="hero-img" data-slot="affirm">${s.emoji||'✨'}</div>`;
  return topbar()+`<div class="full center">${imgBlock}<h2 class="big">${s.big}</h2><p class="lead">${s.lead||''}</p></div>`+footer('Continuar',false);
}

function renderConsent(s){
  const has=s.image&&IMAGES[s.image];
  const imgBlock = has
    ? `<div class="consent-img"><img src="${IMAGES[s.image]}" alt=""></div>`
    : `<div class="hero-img" data-slot="consent" style="height:200px;width:200px;border-radius:50%;margin:8px auto 0">${s.emoji}</div>`;
  return topbar()+`<div class="full center"><h2 class="big">${s.big}</h2><p class="lead" style="margin-bottom:18px">${s.lead}</p>${imgBlock}</div>`+footer('Concordo',false);
}

function renderInput(s){
  const cur=state.answers[s.id]||'';
  const u=s.unitKey?state.unit[s.unitKey]:s.units[0][1];
  const toggle=s.units.length>1?`<div class="unit-toggle">${s.units.map(un=>`<button class="${u===un[1]?'on':''}" onclick="setUnit('${s.unitKey}','${un[1]}')">${un[0]}</button>`).join('')}</div>`:'';
  const uLabel=(s.units.find(un=>un[1]===u)||s.units[0])[0];
  return segBar()+`<div class="body" style="justify-content:center"><h2 class="q-title">${s.title}</h2><div class="inp-wrap">${toggle}<div class="num-in"><input id="num-field" type="text" inputmode="decimal" placeholder="${s.placeholder}" value="${cur}" oninput="onInput('${s.id}')"><span class="u">${uLabel}</span></div></div></div>`+footer('Continuar',!cur);
}

function imcCalc(){
  let h=parseFloat(state.answers.altura), w=parseFloat(state.answers.peso);
  if(state.unit.altura==='ft') h=h*30.48;
  if(state.unit.peso==='lb') w=w*0.4536;
  if(!h||!w) return null;
  return Math.round((w/Math.pow(h/100,2))*10)/10;
}
function imcLabel(b){return b<18.5?'Abaixo do peso':b<25?'Normal':b<30?'Sobrepeso':'Obesa';}
function renderProfile(s){
  const bmi=imcCalc();
  const pos=bmi?Math.max(2,Math.min(98,((bmi-15)/25)*100)):50;
  const objMap={perder:'Perder peso',manter:'Manter o peso',aptidao:'Aptidão física'};
  const diaMap={calmo:'Calmo',familia:'Casa e filhos',ativo:'Ativo'};
  const corpoMap={magra:'Magra',gordura_magra:'Gordura magra',solido:'Sólido',sobrepeso:'Sobrepeso'};
  return topbar()+`
    <div class="full">
      <h2 class="big" style="text-align:center;font-size:24px;margin-bottom:18px">${s.title}</h2>
      <div class="card">
        <div class="imc-top"><span>Índice de Massa Corporal (IMC)</span><span>Normal: 18.5–24.9</span></div>
        <div style="text-align:center;margin-bottom:6px"><span class="imc-you">Você — ${bmi||'—'}</span></div>

        <div style="text-align:center;margin-top:10px;font-size:13px;color:var(--muted);font-weight:600">Classificação: <b style="color:var(--ink)">${bmi?imcLabel(bmi):'—'}</b></div>
      </div>
      <div class="card">
        <div class="pf-row"><div class="pf-ic">🎯</div><div><div class="pf-k">Objetivo principal</div><div class="pf-v">${objMap[state.answers.objetivo]||'Perder peso'}</div></div></div>
        <div class="pf-row"><div class="pf-ic">📅</div><div><div class="pf-k">Estilo de vida</div><div class="pf-v">${diaMap[state.answers.dia_tipico]||'Calmo'}</div></div></div>
        <div class="pf-row"><div class="pf-ic">🧍‍♀️</div><div><div class="pf-k">Tipo de corpo</div><div class="pf-v">${corpoMap[state.answers.ponto_partida]||'—'}</div></div></div>
      </div>
    </div>`+footer('Continuar',false);
}

const LOADER_STEPS=['Analisando suas respostas','Calculando seu IMC e metas','Selecionando exercícios suaves','Montando seu plano personalizado'];
function renderLoader(){
  return topbar()+`<div class="full center"><h2 class="big" style="font-size:24px;margin-bottom:24px">Já estamos preparando o seu plano</h2><div class="ldr-ring"><svg width="150" height="150"><circle cx="75" cy="75" r="66" stroke="#eceef1" stroke-width="11" fill="none"/><circle id="ldr-circle" cx="75" cy="75" r="66" stroke="var(--green)" stroke-width="11" fill="none" stroke-dasharray="414" stroke-dashoffset="414" stroke-linecap="round"/></svg><div class="ldr-pct" id="ldr-pct">0%</div></div><div class="ldr-steps">${LOADER_STEPS.map((t,i)=>`<div class="ldr-step"><div class="s-ic">${i+1}</div><span>${t}</span></div>`).join('')}</div></div>`;
}
function runLoader(){
  const c=document.getElementById('ldr-circle'),pc=document.getElementById('ldr-pct'),st=[...document.querySelectorAll('.ldr-step')];
  let p=0;const t=setInterval(()=>{p+=2;if(p>100)p=100;pc.textContent=p+'%';c.style.strokeDashoffset=414-(414*p/100);const a=Math.floor(p/25);st.forEach((s,i)=>{if(i<a)s.classList.add('done');});if(p>=100){clearInterval(t);st.forEach(s=>s.classList.add('done'));setTimeout(goNext,500);}},45);
}

/* —— AÇÕES —— */
function pickSingle(el,id,val,adv){
  state.answers[id]=val;
  el.parentNode.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));
  el.classList.add('sel');
  if(adv) setTimeout(goNext,200);
}
function toggleMulti(el,id,val,solo){
  const step=STEPS[state.idx];
  let arr=state.answers[id]||[];
  if(solo){ arr=arr.includes(val)?[]:[val]; }
  else{
    arr=arr.filter(v=>{const o=step.opts.find(x=>x.val===v);return !(o&&o.solo);});
    arr=arr.includes(val)?arr.filter(v=>v!==val):[...arr,val];
  }
  state.answers[id]=arr;
  // refletir no DOM sem reconstruir a tela
  el.parentNode.querySelectorAll('.opt').forEach((btn,i)=>{
    const on=arr.includes(step.opts[i].val);
    btn.classList.toggle('sel',on);
    const chk=btn.querySelector('.chk'); if(chk) chk.textContent=on?'✓':'';
  });
  const nb=document.getElementById('next-btn');
  if(nb) nb.disabled = arr.length<(step.min||1);
}
function setUnit(k,u){state.unit[k]=u;render();}
function onInput(id){const raw=document.getElementById('num-field').value;const norm=raw.replace(',','.').replace(/[^0-9.]/g,'');state.answers[id]=norm;document.getElementById('next-btn').disabled=!norm;}
function onEmail(){const e=document.getElementById('email-field').value;const n=document.getElementById('name-field').value;state.answers.email=e;state.answers.nome=n;document.getElementById('next-btn').disabled=!e;}
function setPlan(i){state.plan=i;document.querySelectorAll('.plan-card').forEach((c,idx)=>c.classList.toggle('sel',idx===i));}
function faqToggle(el){el.parentNode.classList.toggle('open');}
function checkout(){ /* TROQUE pela sua URL de checkout (Kiwify/Cartpanda) */ window.location.href="https://google.com"; }
function goNext(){if(state.idx<STEPS.length-1){state.idx++;render();}}
function goBack(){if(state.idx>0){state.idx--;render();}}

/* UTM / Sentinela passthrough */
(function(){const p=new URLSearchParams(location.search);['utm_source','utm_medium','utm_campaign','utm_content','utm_term','sck'].forEach(k=>{const v=p.get(k);if(v)sessionStorage.setItem(k,v);});})();

render();
</script>
